server.port=8080

# Primary PostgreSQL Configuration (commented out for local dev)
#spring.datasource.url=jdbc:postgresql://localhost:5432/trinetra_db
#spring.datasource.username=trinetra
#spring.datasource.password=password123
#spring.datasource.driver-class-name=org.postgresql.Driver

# Fallback H2 In-Memory DB configuration (enabled)
spring.datasource.url=jdbc:h2:mem:trinetradb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# Groq Cloud LLM Configuration
# SECURITY: never hardcode the key here. Set the GROQ_API_KEY environment
# variable before starting the backend, e.g.:
#   export GROQ_API_KEY=your_key_here   (Linux/Mac)
#   set GROQ_API_KEY=your_key_here      (Windows cmd)
# then run: mvn spring-boot:run
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
